    <div class="sidebar">

            <div>

        <div class="sidebar-section">

    <div style="margin-left:240px; padding-left: 20px; width: 85%;">

                        class="bi bi-house-door-fill" viewBox="0 0 16 16">

                            d="M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5" />
                    </svg>
                </a>
            </div>
            <div class="search-bar">
                <input type="search" placeholder="What do you want to listen to?" aria-label="Search">
                <button type="submit" aria-label="Search">

                    </svg>

            </div>
            <div class="upload-button" style="margin-right:12px;">
                <button id="globalUploadBtn" title="Upload music"
                    style="background:none;border:none;cursor:pointer;color:inherit;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                        class="bi bi-file-earmark-arrow-up-fill" viewBox="0 0 16 16">
                        <path
                            d="M9.293 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.707A1 1 0 0 0 13.707 4L10 .293A1 1 0 0 0 9.293 0M9.5 3.5v-2l3 3h-2a1 1 0 0 1-1-1M6.354 9.854a.5.5 0 0 1-.708-.708l2-2a.5.5 0 0 1 .708 0l2 2a.5.5 0 0 1-.708.708L8.5 8.707V12.5a.5.5 0 0 1-1 0V8.707z" />
                    </svg>

            </div>
            <div class="user-avatar">
                <img src="https://ui-avatars.com/api/?name=John+Doe" alt="User Avatar"
                    style="width:32px; height:32px; border-radius:50%;">
            </div>
        </header>

        <input type="file" id="globalFileInput" multiple accept=".mp3,.flac,.m4a,.wav" style="display:none;">


        <main style="padding-top:20px;">
            <section>
                <div class="browse-all-title">Your Profile</div>
                <br>
                <div class="profile-info" style="background:#282828; padding:20px; border-radius:8px;">

                        style="width:100px; height:100px; border-radius:50%; margin-bottom:20px;">
                    <h2 id="profile-name">John Doe</h2>
                    <p>Email: john.doe@example.com</p>
                    <p>Joined: January 2023</p>
                    <p>Favorite Genres: Pop, Hip-Hop</p>
                    <button
                        style="background:#1db954; color:#fff; border:none; padding:10px 20px; border-radius:20px; margin-top:20px;">Edit
                        Profile</button>
                </div>
            </section>
        </main>

    </div>

</body>

<script>
    // ========== AUTHENTICATION HELPERS ==========
    function getAuthToken() {
        return localStorage.getItem('auth_token');
    }

    async function callAPI(url, options = {}) {
        const token = getAuthToken();
        if (!token) {
            window.location.href = '/login';
            return null;
        }

        const headers = options.headers || {};
        headers['Authorization'] = `Bearer ${token}`;
        if (!headers['Content-Type'] && options.body && typeof options.body === 'string') {
            headers['Content-Type'] = 'application/json';
        }

        const response = await fetch(url, { ...options, headers });

        if (response.status === 401) {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user');
            window.location.href = '/login';
            return null;
        }

        if (response.status === 403) {
            console.error('Access denied');
            return null;
        }

        return response;
    }

    function checkAuth() {
        const token = getAuthToken();
        if (!token) {
            window.location.href = '/login';
            return false;
        }
        return true;
    }

    // ========== APPLICATION FUNCTIONS ==========
    function renderPlaylists(playlists) {
        const container = document.getElementById('playlists-container');
        container.innerHTML = '';
        playlists.forEach(playlist => {
            const div = document.createElement('div');
            div.className = 'sidebar-playlist';
            div.innerHTML = `
            <div style="background: linear-gradient(135deg, #1db954, #1ed760); width:36px; height:36px; border-radius:4px; display:flex; align-items:center; justify-content:center;">
                <span style="color:white; font-size:18px;">♪</span>
            </div>
            <a href="/playlists?id=${playlist.id}" class="sidebar-link">
                <span class="sidebar-link-text">${playlist.name}</span>
            </a>
        `;
            container.appendChild(div);
        });
    }

    async function loadData() {
        if (!checkAuth()) return;
        try {
            const [playlistsRes, userRes] = await Promise.all([
                callAPI('/api/user/playlists'),
                callAPI('/api/user')
            ]);
            
            if (!playlistsRes || !playlistsRes.ok) {
                return;
            }
            
            const playlists = await playlistsRes.json();
            const user = await userRes.json();
            
            renderPlaylists(playlists);
            
            document.querySelector('.user-avatar img').src = user.avatar;
            document.getElementById('profile-avatar').src = user.avatar;
            document.getElementById('profile-name').textContent = user.name;
        } catch (error) {
            console.error('Error loading data:', error);
        }
    }

    window.addEventListener('load', loadData);

    // Search functionality
    const searchInput = document.querySelector('.search-bar input');
    const searchButton = document.querySelector('.search-bar button');

    searchButton.addEventListener('click', async () => {
        const query = searchInput.value.trim();
        if (!query) return;
        try {
            const res = await callAPI(`/api/search?q=${encodeURIComponent(query)}`);
            if (!res) return;
            const data = await res.json();
            alert(`Artists: ${data.artists.map(a => a.name).join(', ')}\nPlaylists: ${data.playlists.map(p => p.name).join(', ')}`);
        } catch (error) {
            console.error('Search error:', error);
        }
    });

    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            searchButton.click();
        }
    });

    // Global upload button wiring
    const globalBtn = document.getElementById('globalUploadBtn');
    const globalInput = document.getElementById('globalFileInput');
    if (globalBtn && globalInput) {
        globalBtn.addEventListener('click', () => globalInput.click());
        globalInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            if (typeof handleFileUpload === 'function') { handleFileUpload(files); return; }
            const formData = new FormData();
            for (let f of files) formData.append('files', f);
            try {
                const res = await callAPI('/api/user/songs/upload', { method: 'POST', body: formData });
                if (res && res.ok) { alert('Upload started — check Your Music'); window.location.reload(); }
                else { const err = await res.json(); alert('Upload failed: ' + (err.error || 'unknown')); }
            } catch (err) { alert('Upload failed'); }
        });
    }

    // Mobile hamburger and drawer setup
    function setupMobileHamburger() {
        const mobileHeader = document.getElementById('mobileHeaderContainer');
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const mobileDrawer = document.getElementById('mobileDrawer');
        const drawerOverlay = document.getElementById('drawerOverlay');
        const mobileDrawerPlaylists = document.getElementById('mobileDrawerPlaylists');

        if (!mobileHeader || !hamburgerBtn) return;

        function showHeader() {
            mobileHeader.style.display = window.innerWidth <= 992 ? 'flex' : 'none';
        }

        function renderDrawerPlaylists(playlists) {
            mobileDrawerPlaylists.innerHTML = '';
            playlists.forEach(playlist => {
                const link = document.createElement('a');
                link.className = 'drawer-playlist';
                link.href = `/playlists?id=${playlist.id}`;
                link.innerHTML = `
                    <img src="${playlist.cover}" alt="${playlist.name}">
                    <div class="drawer-playlist-name">${playlist.name}</div>
                `;
                link.addEventListener('click', closeDrawer);
                mobileDrawerPlaylists.appendChild(link);
            });
        }

        function openDrawer() {
            mobileDrawer.classList.add('open');
            drawerOverlay.classList.add('show');
        }

        function closeDrawer() {
            mobileDrawer.classList.remove('open');
            drawerOverlay.classList.remove('show');
        }

        hamburgerBtn.addEventListener('click', openDrawer);
        drawerOverlay.addEventListener('click', closeDrawer);

        showHeader();
        window.addEventListener('resize', showHeader);

        // Load playlists for drawer
        const token = localStorage.getItem('auth_token');
        if (token) {
            fetch('/api/user/playlists', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
                .then(res => res.json())
                .then(playlists => renderDrawerPlaylists(playlists))
                .catch(err => console.error('Error loading drawer playlists:', err));
        }
    }

    setupMobileHamburger();
</script>

</html>
